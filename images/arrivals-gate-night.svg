<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Helvetica, Arial, sans-serif">
  <!-- arrivals hall -->
  <!-- no backdrop: the page behind shows through -->
  <rect y="380" width="1200" height="120" fill="#07073f"/>
  <rect y="378" width="1200" height="4" fill="#2e4a9e"/>
  <!-- big windows with sky -->
  <g fill="#0b1660" stroke="#2e4a9e" stroke-width="2">
    <rect x="40" y="40" width="200" height="250" rx="6"/>
    <rect x="260" y="40" width="200" height="250" rx="6"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="70" cy="70" r="1.6"/><circle cx="210" cy="90" r="1.4"/><circle cx="300" cy="64" r="1.8"/><circle cx="420" cy="110" r="1.3"/><circle cx="360" cy="160" r="1.5"/><circle cx="90" cy="220" r="1.2"/><circle cx="200" cy="250" r="1.5"/>
  </g>
  <g fill="#3b4a8f" opacity="0.9">
    <circle cx="110" cy="120" r="26"/><circle cx="145" cy="108" r="32"/><circle cx="180" cy="122" r="22"/>
    <rect x="86" y="120" width="116" height="26" rx="13"/>
  </g>
  <!-- a plane, landed and taxiing away -->
  <g transform="translate(300 230)" fill="#5566aa">
    <rect x="0" y="8" width="120" height="18" rx="9"/>
    <path d="M40 16 L70 -14 L84 -14 L68 16 Z"/>
    <path d="M100 10 L116 -10 L124 -10 L118 12 Z"/>
  </g>
  <!-- arrivals board -->
  <rect x="520" y="40" width="300" height="120" rx="8" fill="#0d0d4d" stroke="#2e4a9e" stroke-width="2"/>
  <text x="540" y="72" fill="#ffd21f" font-size="20" font-weight="bold" letter-spacing="2">ARRIVALS</text>
  <text x="540" y="104" fill="#ffffff" font-size="16">FROM THE CLOUD</text>
  <text x="730" y="104" fill="#7dd87d" font-size="16" font-weight="bold">LANDED</text>
  <text x="540" y="134" fill="#9fb0c4" font-size="16">YOUR DATA</text>
  <text x="730" y="134" fill="#ffd21f" font-size="16" font-weight="bold">HOME</text>
  <!-- the arrivals gate -->
  <rect x="520" y="200" width="160" height="182" fill="#2e4a9e"/>
  <rect x="534" y="214" width="132" height="168" fill="#ffe7a3"/>
  <text x="560" y="196" fill="#aab6e8" font-size="14" font-weight="bold" letter-spacing="1">GATE 0</text>
  <!-- the data, walking out with its suitcase -->
  <g transform="translate(640 280)">
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#ffd21f"/>
    <rect x="10" y="12" width="50" height="8" rx="4" fill="#f2b705"/>
    <circle cx="22" cy="36" r="5" fill="#1a1a1a"/><circle cx="48" cy="36" r="5" fill="#1a1a1a"/>
    <path d="M24 50 Q35 60 46 50" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M22 70 L18 100 M48 70 L52 100" stroke="#c9d3ff" stroke-width="7" stroke-linecap="round"/>
    <!-- suitcase -->
    <path d="M70 46 L92 46" stroke="#c9d3ff" stroke-width="5" stroke-linecap="round"/>
    <rect x="80" y="54" width="44" height="44" rx="6" fill="#e85d3f"/>
    <rect x="96" y="48" width="12" height="8" rx="3" fill="none" stroke="#7a2a1a" stroke-width="3"/>
  </g>
  <!-- the family waiting, arms open -->
  <g transform="translate(900 210)">
    <!-- adult -->
    <circle cx="40" cy="20" r="22" fill="#c98b5e"/>
    <path d="M10 60 Q40 40 70 60 L76 170 L4 170 Z" fill="#2f7d6d"/>
    <path d="M12 66 L-30 30 M68 66 L110 30" stroke="#2f7d6d" stroke-width="14" stroke-linecap="round"/>
    <rect x="12" y="168" width="18" height="8" fill="#aab6e8"/><rect x="50" y="168" width="18" height="8" fill="#aab6e8"/>
    <!-- child with a sign -->
    <circle cx="150" cy="80" r="16" fill="#e0b28a"/>
    <path d="M128 108 Q150 94 172 108 L176 170 L124 170 Z" fill="#e85d3f"/>
    <rect x="118" y="40" width="64" height="40" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="3" transform="rotate(-6 150 60)"/>
    <text x="126" y="66" fill="#e85d3f" font-size="16" font-weight="bold" transform="rotate(-6 150 60)">&#10084; HOME</text>
  </g>
  <!-- hearts in the air -->
  <g fill="#e85d3f" opacity="0.85">
    <path d="M820 240 c-6-10-22-6-20 6 2 10 20 18 20 18 s18-8 20-18 c2-12-14-16-20-6z"/>
    <path d="M860 200 c-4-7-15-4-14 4 1 7 14 12 14 12 s13-5 14-12 c1-8-10-11-14-4z" opacity="0.7"/>
  </g>
</svg>
